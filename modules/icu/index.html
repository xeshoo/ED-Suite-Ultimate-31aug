<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#0b1b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<title>ICU Admission Suite</title>
<link rel="manifest" href="../../manifest.json">
<script src="../../shared/docx-lite.js" defer></script>
<script src="../../shared/clinical-calc.js" defer></script>
<script src="../../shared/autosave.js"></script>
<style>
:root{
  --navy:#0b1b2b;
  --navy2:#132b40;
  --teal:#0f8a8a;
  --teal-d:#0b6868;
  --amber:#d98e2b;
  --red:#b8412f;
  --paper:#f6f7f5;
  --ink:#1b2530;
  --ink-soft:#5b6b7a;
  --line:#dbe2e6;
  --mono:'SF Mono',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;padding-bottom:78px;}
h1,h2,h3{font-family:'Georgia',serif;margin:0;}

/* Header */
header{background:var(--navy);color:#eef3f5;padding:14px 16px 10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr-top h1{font-size:19px;letter-spacing:.3px;}
.hdr-sub{font-size:11px;color:#9db3c2;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(15,138,138,.6);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,138,138,.55);}70%{box-shadow:0 0 0 8px rgba(15,138,138,0);}100%{box-shadow:0 0 0 0 rgba(15,138,138,0);}}

/* Tab nav - horizontal scroll */
.tabbar{display:flex;overflow-x:auto;gap:6px;margin-top:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#c8d6de;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s;}
.tab-btn:active{transform:scale(.95);}
.tab-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}

main{max-width:760px;margin:0 auto;padding:14px 12px 20px;}
.section{display:none;animation:fade .15s ease;}
.section.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.card h2{font-size:15px;color:var(--navy2);border-bottom:2px solid var(--teal);padding-bottom:8px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card h2 .idx{background:var(--navy2);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;}
.subhead{font-size:12.5px;font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;}
.subhead:first-child{margin-top:0;}

label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fbfcfc;color:var(--ink);font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,138,138,.12);}
textarea{resize:vertical;min-height:52px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.field{margin-bottom:10px;}
@media(max-width:480px){.row3{grid-template-columns:1fr 1fr;}.row4{grid-template-columns:1fr 1fr;}}

.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{border:1px solid var(--line);background:#fbfcfc;padding:7px 13px;border-radius:16px;font-size:13px;cursor:pointer;user-select:none;transition:all .15s;font-weight:500;}
.chip:active{transform:scale(.95);}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
.chip.on.crit{background:var(--red);border-color:var(--red);}

.calc-box{background:var(--navy);color:#eef3f5;border-radius:12px;padding:14px 16px;margin-top:10px;}
.calc-box .score-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
.calc-box .score-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--teal);}
.calc-box .score-label{font-size:11px;color:#9db3c2;text-transform:uppercase;letter-spacing:.5px;}
.calc-box .interp{font-size:12.5px;color:#cfe0e8;margin-top:6px;}
.badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-left:6px;}
.badge.low{background:#1f6b4a;color:#d8f5e5;}
.badge.mid{background:var(--amber);color:#2a1c02;}
.badge.high{background:var(--red);color:#fde;}

.note{font-size:11.5px;color:var(--ink-soft);background:#f0f4f2;border-left:3px solid var(--teal);padding:8px 11px;border-radius:6px;margin-top:8px;}
.flag{font-size:11.5px;color:#7a2418;background:#fbeae6;border-left:3px solid var(--red);padding:8px 11px;border-radius:6px;margin-top:8px;}

table.mini{width:100%;border-collapse:collapse;font-size:13px;}
table.mini th{text-align:left;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;padding:5px 7px;border-bottom:1px solid var(--line);}
table.mini td{padding:5px 7px;border-bottom:1px solid #eef1f1;}
table.mini input{padding:6px 7px;font-size:16px;}

.bundle-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f1;}
.bundle-item:last-child{border-bottom:none;}
.bundle-item input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex-shrink:0;accent-color:var(--teal);}
.bundle-item .txt b{color:var(--navy2);}
.bundle-item .txt textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fbfcfc;font-family:inherit;color:var(--ink);}

/* Footer action bar */
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;gap:6px;padding:10px 8px;box-shadow:0 -2px 12px rgba(0,0,0,.3);z-index:60;}
.footbar button{flex:1;background:rgba(255,255,255,.08);color:#e8eef1;border:1px solid rgba(255,255,255,.15);padding:10px 4px;border-radius:10px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s,transform .1s;}
.footbar button:active{transform:scale(.94);background:rgba(255,255,255,.15);}
.footbar button.primary{background:var(--teal);border-color:var(--teal);}
.footbar button.primary:active{background:var(--teal-d);}
.footbar button svg{width:18px;height:18px;}

.progress-wrap{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:10px;overflow:hidden;}
.score-strip{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.score-strip .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:4px 12px;font-size:11px;color:#cfe0e8;font-family:var(--mono);}
.score-strip .pill b{color:#fff;}
.score-strip .pill.warn{background:rgba(217,142,43,.25);border-color:var(--amber);}
.score-strip .pill.crit{background:rgba(184,65,47,.3);border-color:var(--red);}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--teal),#0fb8a5);width:0%;transition:width .3s ease;}

/* Print */
@media print{
  header,.footbar,.tabbar{display:none !important;}
  body{padding:0;background:#fff;}
  .section{display:block !important;page-break-inside:avoid;}
  .card{border:1px solid #999;box-shadow:none;break-inside:avoid;margin-bottom:10px;}
  .calc-box{background:#eee !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .calc-box .score-val{color:#000;}
  main{max-width:100%;padding:0;}
}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.toast.show{opacity:1;}

.margin-panel{position:fixed;bottom:70px;left:10px;right:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 -4px 20px rgba(0,0,0,.2);z-index:65;flex-direction:column;gap:8px;}
.margin-panel .mp-title{font-size:12.5px;font-weight:700;color:var(--navy2);}
.margin-panel .mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.margin-panel .mp-grid label{font-size:11px;color:var(--ink-soft);font-weight:600;}
.margin-panel .mp-grid input{width:100%;margin-top:3px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:16px;}
.margin-panel .mp-note{font-size:11px;color:var(--ink-soft);line-height:1.35;}
.margin-panel .mp-done{background:var(--teal);color:#fff;border:none;padding:9px;border-radius:7px;font-weight:700;font-size:13px;}
.safety-overlay{display:none;position:fixed;inset:0;background:rgba(11,27,43,.55);z-index:200;align-items:flex-end;justify-content:center;}
.safety-overlay.show{display:flex;}
.safety-modal{background:#fff;border-radius:16px 16px 0 0;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:18px 18px 14px;box-shadow:0 -6px 24px rgba(0,0,0,.3);}
.safety-modal h3{margin:0 0 4px;font-size:16px;color:var(--navy2);}
.safety-modal .sm-sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.safety-modal .sm-group{margin-bottom:12px;}
.safety-modal .sm-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.safety-modal .sm-label.crit{color:var(--red);}
.safety-modal .sm-label.warn{color:var(--amber);}
.safety-modal .sm-label.inc{color:var(--teal-d);}
.safety-modal ul{margin:0;padding-left:18px;font-size:13px;line-height:1.5;color:#2a2a2a;}
.safety-modal .sm-ready{background:#eef7f0;border-left:3px solid #2e8b57;padding:10px 12px;border-radius:6px;font-size:13px;color:#1f5c38;font-weight:600;}
.safety-modal .sm-actions{display:flex;gap:8px;margin-top:14px;}
.safety-modal .sm-actions button{flex:1;padding:11px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid var(--line);background:#fff;}
.safety-modal .sm-actions button.sm-primary{background:var(--teal);color:#fff;border-color:var(--teal);}
.safety-modal .sm-actions button.sm-danger{background:#fff;color:var(--red);border-color:var(--red);}
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <a href="../../index.html" style="background:rgba(255,255,255,0.08);color:#eef3f5;border:1px solid rgba(255,255,255,0.15);padding:7px 14px;border-radius:20px;font-size:12px;text-decoration:none;white-space:nowrap;transition:background .15s">⌂ ED Suite</a>
    <div>
      <h1>ICU Admission Suite</h1>
      <div class="hdr-sub"><span class="pulse" style="display:inline-block;vertical-align:middle;margin-right:5px;"></span>Digital admission note &amp; severity scoring</div>
    </div>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="score-strip" id="scoreStrip"></div>
</header>

<main id="main"></main>

<div class="margin-panel" id="marginPanel" style="display:none;">
  <div class="mp-title">Print margins (mm) — tune to match your letterhead stock</div>
  <div class="mp-grid">
    <label>Top<input type="number" min="0" max="80" step="0.5" value="65" oninput="updateMargin('top',this.value)"></label>
    <label>Left<input type="number" min="0" max="80" step="0.5" value="12" oninput="updateMargin('left',this.value)"></label>
    <label>Right<input type="number" min="0" max="80" step="0.5" value="12" oninput="updateMargin('right',this.value)"></label>
    <label>Bottom<input type="number" min="0" max="80" step="0.5" value="12" oninput="updateMargin('bottom',this.value)"></label>
  </div>
  <div class="mp-note">Set <b>Top</b> margin to clear your hospital letterhead header (~65mm / 2.5 inches). Adjust <b>Left</b> if paper has a ruled border. Values are remembered for this session.</div>
  <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;flex-wrap:wrap;">
    <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="hwToggle" onchange="HW_STYLE=this.checked;document.getElementById('hwFontSel').style.display=this.checked?'inline-block':'none';" style="width:16px;height:16px;margin:0;"> \u270D\uFE0F Handwritten style (Print/PDF only — needs internet on first use)</label>
    <select id="hwFontSel" onchange="HW_FONT_CHOICE=this.value;" style="display:none;font-size:12px;padding:2px 6px;">
      <option value="kalam">Kalam</option>
      <option value="caveat">Caveat</option>
    </select>
  </div>
  <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:6px;flex-wrap:wrap;">
    <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="condensedToggle" onchange="CONDENSED_MODE=this.checked;" style="width:16px;height:16px;margin:0;"> \ud83d\udcc4 Condensed format (dense single-column table \u2014 fewer printed pages; applies to Print/PDF and Word)</label>
  </div>
  <button class="mp-done" onclick="toggleMarginPanel()">Done</button>
</div>

<div class="footbar">
  <button onclick="toggleMarginPanel()" title="Print margins">⚙️<span>Margins</span></button>
  <button onclick="openSafetyPanel()" title="Safety check" id="safetyBtn">⚖️<span>Safety</span></button>
  <button class="primary" onclick="requestExport('print')">🖨️<span>Print / PDF</span></button>
  <button onclick="requestExport('word')">📄<span>Word</span></button>
  <button onclick="requestExport('copy')">📋<span>Copy Note</span></button>
  <button onclick="resetAll()">↺<span>Reset</span></button>
</div>

<div class="toast" id="toast"></div>

<div class="safety-overlay" id="safetyOverlay">
  <div class="safety-modal" id="safetyModal"></div>
</div>

<script>
/* ============================================================
   ICU ADMISSION SUITE - app logic
   ============================================================ */

const TABS = [
  {id:'id',   label:'1 · ID / Admit'},
  {id:'dx',   label:'2 · Diagnosis'},
  {id:'hist', label:'3 · History'},
  {id:'exam', label:'4 · Exam / Vitals'},
  {id:'labs', label:'5 · Investigations'},
  {id:'scores',label:'6 · Severity Scores'},
  {id:'orders',label:'7 · Resuscitation & Orders'},
  {id:'ethics',label:'8 · Consent / Code'},
  {id:'plan', label:'9 · Management Plan'},
  {id:'bundle',label:'10 · Care Bundle'},
  {id:'traject',label:'11 · Trajectory'},
  {id:'sbar', label:'12 · Handover'},
  {id:'reassess',label:'13 · Reassessments'},
  {id:'sign', label:'14 · Signatures'}
];

function chip(name, val, crit){
  return `<span class="chip${crit?' data-crit':''}" data-group="${name}" data-val="${val}" role="button" tabindex="0" aria-pressed="false" onclick="toggleChip(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleChip(this)}">${val}</span>`;
}
function chipGroup(name, options, critSet){
  critSet = critSet || [];
  return `<div class="chip-group" id="grp_${name}" role="group" aria-label="${esc(name)} options">` + options.map(o=>{
    const isCrit = critSet.includes(o);
    return `<span class="chip${isCrit?' crit-candidate':''}" data-group="${name}" role="button" tabindex="0" aria-pressed="false" onclick="toggleChip(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleChip(this)}">${o}</span>`;
  }).join('') + `</div>`;
}
function toggleChip(el){
  const group = el.dataset.group;
  const wrap = el.parentElement;
  if(wrap.dataset.multi === '1'){
    el.classList.toggle('on');
    if(el.classList.contains('crit-candidate')) el.classList.toggle('crit', el.classList.contains('on'));
    el.setAttribute('aria-pressed', el.classList.contains('on') ? 'true' : 'false');
  } else {
    const wasOn = el.classList.contains('on');
    [...wrap.children].forEach(c=>{c.classList.remove('on');c.classList.remove('crit');c.setAttribute('aria-pressed','false');});
    if(!wasOn){
      el.classList.add('on');
      if(el.classList.contains('crit-candidate')) el.classList.add('crit');
      el.setAttribute('aria-pressed','true');
    }
  }
  updateProgress();
  if(group==='indications') renderICUCriteriaFlag();
  if(group==='arf' || group==='apchronic') calcAPACHE();
  if(group==='ventpreset') renderVentSuggestion();
  if(group==='stmorph'){ /* informational only, no scoring */ }
  if(group==='airway') toggleAirwayPlanField();
}
function toggleAirwayPlanField(){
  const status = getChipValue('airway', false);
  const wrap = document.getElementById('airwayPlanWrap');
  if(!wrap) return;
  wrap.style.display = (status && status !== 'Intubated') ? 'block' : 'none';
}
function getChipValue(name, multi){
  const wrap = document.getElementById('grp_'+name);
  if(!wrap) return multi? [] : '';
  const on = [...wrap.querySelectorAll('.chip.on')].map(c=>c.textContent);
  return multi ? on : (on[0]||'');
}
function addCustomExamFinding(){
  const inp = document.getElementById('examCustomInput');
  if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  const wrap = document.getElementById('grp_exam');
  if(!wrap) return;
  const chipEl = document.createElement('span');
  chipEl.className = 'chip on';
  chipEl.dataset.group = 'exam';
  chipEl.setAttribute('role','button'); chipEl.setAttribute('tabindex','0'); chipEl.setAttribute('aria-pressed','true');
  chipEl.onclick = function(){ toggleChip(this); };
  chipEl.textContent = text;
  wrap.appendChild(chipEl);
  inp.value = '';
  updateProgress();
}

/* ---------------- SECTION BUILDERS ---------------- */

function sec_id(){
  return `
  <div class="card">
    <h2><span class="idx">A</span> Patient Identification</h2>
    <div class="row3">
      <div class="field"><label>Patient Name</label><input type="text" id="p_name"></div>
      <div class="field"><label>MRN</label><input type="text" id="p_mrn"></div>
      <div class="field"><label>Age (yrs)</label><input type="number" id="p_age" min="0" max="120" oninput="onAgeTyped()"></div>
    </div>
    <div class="row3">
      <div class="field"><label>Sex</label><select id="p_sex" onchange="calcRenalDosing();renderVentSuggestion();"><option value="">—</option><option value="M">Male</option><option value="F">Female</option></select></div>
      <div class="field"><label>Date of Birth <span style="font-weight:400;color:var(--ink-soft,#7a8699);">(auto-fills age)</span></label><input type="date" id="p_dob" onchange="onDobPicked()"></div>
      <div class="field"><label>Contact / Next of Kin</label><input type="text" id="p_nok"></div>
    </div>
  </div>
  <div class="card">
    <h2><span class="idx">B</span> Admission Details</h2>
    <div class="row3">
      <div class="field"><label>Date</label><input type="date" id="a_date"></div>
      <div class="field"><label>Time</label><input type="time" id="a_time"></div>
      <div class="field"><label>ICU / Bed</label><input type="text" id="a_bed"></div>
    </div>
    <label>Source of Admission</label>
    ${chipGroup('source',['ED','Ward transfer','OT / Post-op','Inter-hospital transfer','Direct / OPD'])}
    <div class="row">
      <div class="field"><label>Referring team / physician</label><input type="text" id="a_ref"></div>
      <div class="field"><label>Receiving ICU physician</label><input type="text" id="a_rec"></div>
    </div>
    <div class="note">Trimmed from the original: insurance/payment class and duplicate signature blocks removed from this section — retained once under Signatures (Sec. 11) only.</div>
  </div>`;
}

function sec_dx(){
  return `
  <div class="card">
    <h2><span class="idx">C</span> Diagnosis</h2>
    <div class="field"><label>Primary diagnosis / reason for ICU admission</label><textarea id="dx_primary"></textarea></div>
    <div class="field"><label>Key comorbidities / secondary diagnoses</label><textarea id="dx_secondary"></textarea></div>
  </div>
  <div class="card">
    <h2><span class="idx">D</span> ICU Admission Criteria <span style="font-weight:400;font-size:11px;color:var(--ink-soft)">(SCCM prioritisation model — tap all that apply)</span></h2>
    <div class="chip-group" id="grp_indications" data-multi="1">
      ${['Invasive mechanical ventilation','NIV / HFNC >3h','Vasopressor or inotrope requirement','Hemodynamic instability post-fluids',
         'GCS decline / new AMS','SpO\u2082 <90% on \u226550% O\u2082','RR >35 or labored breathing','pH <7.30 or PaCO\u2082 >50',
         'Lactate >2 mmol/L, not clearing','AKI needing CRRT','Multi-organ dysfunction (\u22652 systems)','High-risk post-op',
         'Sepsis / septic shock','Cardiac arrest with ROSC','Close neuro monitoring','Other']

function removeMedRecon(id){

function renderMedRecon(){
  const box=document.getElementById('medReconBox'); if(!box) return;
  const all=[...medReconList, ...medReconCustom];
  box.innerHTML = '<table class="mini"><thead><tr><th>Medication</th><th>Home Dose</th><th>Action</th><th>Reason if Hold/Stop</th><th></th></tr></thead><tbody>'+
    all.map(m=>'<tr style="'+(m.flag?'background:#fdf3e3;':'')+'">'+
      '<td style="font-weight:'+(m.flag?'700':'400')+';">'+esc(m.name)+(m.flag?' \u26a0':'')+'</td>'+
      '<td><input type="text" id="'+m.id+'_dose" value="'+esc(m.dose)+'" style="padding:4px 6px;font-size:13px;min-width:80px;"></td>'+
      '<td><select id="'+m.id+'_action" style="padding:4px 6px;font-size:13px;" onchange="document.getElementById(\''+m.id+'_reason\').style.display=(this.value===\'Hold\'||this.value===\'Stop\')?\'block\':\'none\';updateProgress();">'+

      '<td>'+(m.flag?'':'<span onclick="removeMedRecon(\''+m.id+'\')" role="button" tabindex="0" aria-label="Remove '+esc(m.name)+'" style="cursor:pointer;color:var(--red);font-weight:800;">&times;</span>')+'</td>'+
    '</tr>').join('')+
  '</tbody></table>';
}
function collectMedRecon(){
  // medReconList items pre-fill their dose field with a placeholder ('—')
  // that reads back as truthy even when untouched — so a fixed-list med only
  // belongs in the note if the clinician actually selected an action or
  // edited the dose away from that placeholder. A custom-added med is
  // different: the act of adding it is itself the clinician's signal, so it
  // always appears once added, regardless of whether action/dose are set yet.
  const listResults = medReconList.map(m=>{
    const action=val(m.id+'_action');
    const dose=val(m.id+'_dose');
    const reason=val(m.id+'_reason');
    const doseChanged = dose && dose!==m.dose;
    if(!action && !doseChanged) return null;
    let line=m.name;
    if(doseChanged) line+=' '+dose;
    if(action) line+=' \u2192 '+action;
    if(reason) line+=' ('+reason+')';
    return line;
  }).filter(Boolean);
  const customResults = medReconCustom.map(m=>{
    const action=val(m.id+'_action');
    const dose=val(m.id+'_dose')||m.dose;
    const reason=val(m.id+'_reason');
    let line=m.name;
    if(dose) line+=' '+dose;
    if(action) line+=' \u2192 '+action;
    if(reason) line+=' ('+reason+')';
    return line;
  });
  return [...listResults, ...customResults];
}

let selectedAbx = new Set();
function getCurrentCrcl(){
  const t = (document.getElementById('crclVal')||{}).textContent;
  if(!t || t==='\u2014') return null;
  const n = parseInt(t,10);
  return isNaN(n)? null : n;
}
function toggleAbx(id){
  if(selectedAbx.has(id)) selectedAbx.delete(id); else selectedAbx.add(id);
  renderAbxList();
  updateProgress();
}
function clearAllAbx(){
  if(!selectedAbx.size) return;
  if(!confirm('Clear all selected antibiotics for this patient?')) return;
  selectedAbx = new Set();
  renderAbxList();
  updateProgress();
  if (icuAutoSave) icuAutoSave.save && icuAutoSave.save();
  showToast('Antibiotic selections cleared');
}
function renderAbxList(){
  const box = document.getElementById('abxListBox');
  if(!box) return;
  const crcl = getCurrentCrcl();
  box.innerHTML = `<div class="check-list-icu">${ICU_ANTIBIOTICS.map(ab=>{
    const sel = selectedAbx.has(ab.id);
    const adj = ab.renal(crcl);
    return `<div class="bundle-item" style="border-bottom:1px solid #eef1f1;">
      <input type="checkbox" id="abx_${ab.id}" ${sel?'checked':''} onchange="toggleAbx('${ab.id}')">

        <b>${esc(ab.label)}</b> \u2014 ${esc(ab.dose)}
        ${adj? `<br><span style="color:var(--red);font-weight:700;font-size:12px;">\u{1F527} CrCl ${crcl}: ${esc(adj)}</span>` : ''}
      </span>
    </div>`;
  }).join('')}</div>`;
}
function collectSelectedAbx(){
  const crcl = getCurrentCrcl();
  return [...selectedAbx].map(id=>{
    const ab = ICU_ANTIBIOTICS.find(a=>a.id===id);
    if(!ab) return null;
    const adj = ab.renal(crcl);
    return `${ab.label} \u2014 ${adj || ab.dose}`;
  }).filter(Boolean);
}

const VENT_PRESETS = {
  ards:{label:'ARDS / Lung-Protective',tvLowMult:6,tvHighMult:6,rr:'20\u201330/min, titrate to pH (permissive hypercapnia acceptable if pH \u22657.20)',peep:'8\u201312 cmH\u2082O \u2014 titrate via low-PEEP/FiO\u2082 ARDSnet table',fio2:'Lowest FiO\u2082 for SpO\u2082 88\u201395%',ie:'1:1\u20131:2',mode:'Volume Control (VC) or PRVC',
    apply:{modeValue:'Volume Control (VC)', rr:24, peep:10, fio2:60, ie:'1:2'}},
  copd:{label:'COPD / Asthma',tvLowMult:6,tvHighMult:8,rr:'8\u201312/min \u2014 keep LOW to avoid breath-stacking/auto-PEEP',peep:'Set \u2264 measured intrinsic PEEP (often 0\u20135)',fio2:'Lowest FiO\u2082 for SpO\u2082 88\u201392%',ie:'1:3\u20131:4 \u2014 prolong expiratory time',mode:'VC or Pressure Support (PSV)',
    apply:{modeValue:'Volume Control (VC)', rr:10, peep:3, fio2:40, ie:'1:3'}},
  normal:{label:'Normal / Post-op',tvLowMult:6,tvHighMult:8,rr:'12\u201316/min',peep:'5 cmH\u2082O',fio2:'30\u201340%, titrate for SpO\u2082 \u226594%',ie:'1:2',mode:'VC, PRVC or SIMV',
    apply:{modeValue:'Volume Control (VC)', rr:14, peep:5, fio2:35, ie:'1:2'}}
};
function calcIBW(){
  const htCm=+val('v_ht'); const sex=val('p_sex');
  if(!htCm) return null;
  const inches = htCm/2.54;
  if(inches<55) return null;
  const base = sex==='F'?45.5:50;
  return +(base + 2.3*(inches-60)).toFixed(1);
}
function renderVentSuggestion(){
  const box = document.getElementById('ventSuggestBox');
  if(!box) return;
  const chosen = [...document.querySelectorAll('#grp_ventpreset .chip.on')].map(c=>c.textContent)[0];
  if(!chosen){ box.innerHTML=''; return; }
  const key = chosen.startsWith('ARDS')?'ards':(chosen.startsWith('COPD')?'copd':'normal');
  const p = VENT_PRESETS[key];
  const ibw = calcIBW();
  const tv = ibw? `${Math.round(ibw*p.tvLowMult)}\u2013${Math.round(ibw*p.tvHighMult)} mL (IBW ${ibw} kg)` : 'Enter height (Sec. F) & sex (Sec. A) for IBW-based target';
  box.innerHTML = `<div class="calc-box">
    <div class="score-row"><span class="score-label">Suggested \u2014 ${esc(p.label)}</span><span><span onclick="applyVentSuggestion('${key}')" style="cursor:pointer;color:var(--teal-d);font-weight:800;padding:0 8px 0 0;">\u2713 Apply</span><span onclick="dismissVentSuggestion()" style="cursor:pointer;color:#9db3c2;font-weight:800;padding:0 4px;">&times; Dismiss</span></span></div>

    <div class="interp">RR: ${esc(p.rr)}</div>
    <div class="interp">PEEP: ${esc(p.peep)}</div>
    <div class="interp">FiO\u2082: ${esc(p.fio2)}</div>
    <div class="interp">I:E: ${esc(p.ie)}</div>
    <div class="note" style="margin-top:6px;">Apply fills the Ventilator Settings fields with a reasonable starting point from this preset (tidal volume from IBW, midpoint RR/PEEP/FiO\u2082) \u2014 review and titrate to the actual patient before signing.</div>
  </div>`;
}
function applyVentSuggestion(key){
  const p = VENT_PRESETS[key];
  if(!p || !p.apply) return;
  const ibw = calcIBW();
  const tvMid = ibw? Math.round(ibw*((p.tvLowMult+p.tvHighMult)/2)) : '';
  setVal('vent_mode', p.apply.modeValue);
  if(tvMid) setVal('vent_tv', tvMid);
  setVal('vent_rr', p.apply.rr);
  setVal('vent_peep', p.apply.peep);
  setVal('vent_fio2', p.apply.fio2);
  setVal('vent_ie', p.apply.ie);
  updateProgress();
}

    <table class="mini"><thead><tr><th>Time</th><th>MAP (mmHg)</th><th>Vasopressor dose</th><th>Lactate</th><th>pH</th><th>PaO\u2082</th><th>Urine</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="calc-box" style="margin-top:10px;">
      <div class="score-row"><span class="score-label">Trajectory Classification</span><span class="score-val" id="trajectClass" style="font-size:20px;color:var(--amber);">\u2014</span></div>
      <div class="interp" id="trajectDetails"></div>
    </div>

  </div>`;
}
function trajectInputHandlers(){
  ['0h','2h','4h','6h','12h'].forEach(t=>{
    ['tr_map_'+t,'tr_pressor_'+t,'tr_lactate_'+t,'tr_ph_'+t,'tr_pao2_'+t,'tr_uo_'+t].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.addEventListener('input', calcTrajectory);
    });
  });
}
function calcTrajectory(){
  const isNum = v=>!isNaN(v) && v!==null && v!=='';
  const lactates = ['0h','2h','4h','6h','12h'].map(t=>+val('tr_lactate_'+t)).filter((v,i,a)=>val('tr_lactate_'+['0h','2h','4h','6h','12h'][i])!=='' && isNum(v));
  const maps = ['0h','2h','4h','6h','12h'].map(t=>+val('tr_map_'+t)).filter((v,i,a)=>val('tr_map_'+['0h','2h','4h','6h','12h'][i])!=='' && isNum(v));
  const cls=document.getElementById('trajectClass'); const det=document.getElementById('trajectDetails');
  if(!cls) return;
  if(lactates.length<2 && maps.length<2){ cls.textContent='\u2014'; det.textContent='Enter at least two time points (lactate or MAP) to classify.'; return; }
  let trend='Stable';
  let reasons=[];
  if(lactates.length>=2){
    const first=lactates[0], last=lactates[lactates.length-1];
    const change = first ? ((last-first)/first*100) : 0;
    if(change>20){ trend='Worsening'; reasons.push('Lactate \u2191 >20%'); }
    else if(change<-20){ trend='Improving'; reasons.push('Lactate \u2193 >20%'); }
  }
  if(maps.length>=2){
    const first=maps[0], last=maps[maps.length-1];
    if(last<65 && first>=65){ trend='Worsening'; reasons.push('MAP dropped below 65'); }
    else if(last>=65 && first<65){ trend='Improving'; reasons.push('MAP improved above 65'); }
  }
  cls.textContent = trend;
  cls.style.color = trend==='Worsening' ? 'var(--red)' : (trend==='Improving' ? '#2e8b57' : 'var(--amber)');
  det.textContent = reasons.length ? 'Driven by: '+reasons.join('; ') : 'No clear directional change \u2014 stable.';
}

function generateReassessments(){
  const items = [];
  const now = new Date();
  const addTime = (h,m) => { const d = new Date(now.getTime() + (h*60+m)*60000); return d.toTimeString().slice(0,5); };

  const ph = +val('abg_ph');
  if(ph>0 && ph<7.20) items.push({task:'Repeat ABG', when:'30\u201360 min', time:addTime(0,45), critical:true, reason:'Severe acidemia (pH '+ph+')'});
  else if(ph>0 && ph<7.30) items.push({task:'Repeat ABG', when:'1\u20132 h', time:addTime(1,30), critical:false, reason:'Acidemia (pH '+ph+')'});

  const lac = +val('l_lac');
  if(lac>4) items.push({task:'Repeat lactate', when:'2 h', time:addTime(2,0), critical:true, reason:'Lactate '+lac+' mmol/L \u2013 assess clearance'});
  else if(lac>2) items.push({task:'Repeat lactate', when:'4\u20136 h', time:addTime(4,0), critical:false, reason:'Lactate '+lac+' mmol/L'});

  const fluidVol = +val('ord_fluid_vol');
  const fluidResp = getChipValue('fluidresp');
  if(fluidVol>0 && fluidResp!=='Improved') items.push({task:'Hemodynamic reassessment', when:'30\u201360 min post-bolus', time:addTime(0,45), critical:true, reason:'Post-fluid bolus '+fluidVol+'mL \u2013 response: '+(fluidResp||'not assessed')});

  const pressor = getChipValue('pressor');
  if(pressor && pressor!=='None') items.push({task:'Vasopressor titration check', when:'15\u201330 min', time:addTime(0,20), critical:true, reason:pressor+' active \u2013 reassess against target MAP'});

  const airway = getChipValue('airway');
  const oxy = getChipValue('oxy');
  if(oxy==='Invasive MV' || airway==='Intubated') items.push({task:'Post-intubation ABG', when:'30 min after setup', time:addTime(0,30), critical:true, reason:'Verify ventilation after intubation'});

  const cr = +val('l_cr');
  if(cr>150) items.push({task:'Renal reassessment (U&E, urine output)', when:'6\u201312 h', time:addTime(6,0), critical:false, reason:'Creatinine '+cr+' \u00b5mol/L \u2013 monitor AKI trajectory'});

  if(oxy==='Invasive MV') items.push({task:'Daily SAT/SBT assessment', when:'Next morning round', time:'06:00', critical:false, reason:'Ventilated patient \u2013 daily sedation interruption + spontaneous breathing trial'});

  if(selectedAbx.size>0) items.push({task:'Antibiotic review (48\u201372h)', when:'48 h', time:addTime(48,0), critical:false, reason:'De-escalation / stop review per stewardship'});

  items.push({task:'VTE risk reassessment', when:'24 h', time:addTime(24,0), critical:false, reason:'Daily VTE prophylaxis review'});
  items.push({task:'Glucose check', when:'1\u20134 h (if insulin)', time:addTime(2,0), critical:false, reason:'Glycemic monitoring per protocol'});
  items.push({task:'CAM-ICU delirium screen', when:'Each shift (q8\u201312h)', time:addTime(8,0), critical:false, reason:'Delirium screening per PADIS guidelines'});

  return items;
}

/* ---------------- CALCULATORS ---------------- */
function calcMAP(){
  const s=+val('v_sbp'), d=+val('v_dbp'), hr=+val('v_hr');
  if(s&&d){ const map=Math.round((s+2*d)/3); setVal('v_map', map+' mmHg'); } else setVal('v_map','');

  const box = document.getElementById('shockIndexBox');
  if(box){
    if(hr && s){
      const si = (hr/s).toFixed(2);
      let level = 'normal', msg = 'Normal range.';
      if(si>=1.0){ level='high'; msg='Markedly elevated \u2014 strongly suggests occult hypoperfusion/shock even if BP looks reassuring.'; }
      else if(si>=0.7){ level='mid'; msg='Elevated \u2014 possible early/compensated shock; correlate with lactate and perfusion.'; }
      box.innerHTML = `<div class="note" style="${level==='high'?'border-left-color:var(--red);background:#fbeae6;':(level==='mid'?'border-left-color:var(--amber);background:#fdf3e3;':'')}"><b>Shock Index (HR/SBP): ${si}</b> \u2014 ${msg}</div>`;
    } else { box.innerHTML=''; }
  }
  calcSOFA(); calcAPACHE();
  updateProgress();
}

function calcAgeFromDob(dobStr){
  if(!dobStr) return null;

  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age >= 0 ? age : null;
}

/* ---------------- ACID-BASE ANALYZER ----------------
   Pure calculation kept separate from DOM rendering so the
   Clinical Safety Engine can reuse the same numbers without
   re-parsing the page. Returns null for any value whose inputs
   aren't all present — never silently substitutes a default. */
function getAcidBaseAnalysis(){
  const na=+val('l_na')||null, cl=+val('l_cl')||null, hco3=+val('abg_hco3')||null;
  const alb=+val('l_alb')||null, paco2=+val('abg_paco2')||null, ph=+val('abg_ph')||null;
  const out = { ag:null, agCorr:null, wintersLow:null, wintersHigh:null, wintersFlag:null, deltaGap:null, deltaRatio:null };
  if(na!=null && cl!=null && hco3!=null){
    out.ag = na - (cl + hco3);
    out.agCorr = (alb!=null) ? out.ag + 2.5*(4 - alb/10) : null; // alb g/L -> g/dL: /10
  }
  if(hco3!=null){
    out.wintersLow = 1.5*hco3 + 8 - 2;
    out.wintersHigh = 1.5*hco3 + 8 + 2;
    if(paco2!=null){
      if(paco2 > out.wintersHigh) out.wintersFlag = 'high'; // inadequate compensation / concurrent resp acidosis
      else if(paco2 < out.wintersLow) out.wintersFlag = 'low'; // concurrent resp alkalosis
      else out.wintersFlag = 'appropriate';
    }
  }
  if(out.ag!=null && hco3!=null){
    out.deltaGap = out.ag - 12; // 12 = assumed normal AG
    out.deltaRatio = hco3!==24 ? out.deltaGap / (24 - hco3) : null;
  }
  out._inputs = {na,cl,hco3,alb,paco2,ph};
  return out;
}
function calcAcidBase(){
  const r = getAcidBaseAnalysis();
  const agEl=document.getElementById('agVal'), agCEl=document.getElementById('agCorrVal'), wEl=document.getElementById('wintersVal'), dEl=document.getElementById('deltaVal'), iEl=document.getElementById('acidBaseInterp');
  if(!agEl) return; // section not yet rendered
  agEl.textContent = r.ag!=null ? r.ag.toFixed(1)+' mmol/L' : '—';
  agCEl.textContent = r.agCorr!=null ? r.agCorr.toFixed(1)+' mmol/L' : (r.ag!=null ? 'need albumin' : '—');
  wEl.textContent = (r.wintersLow!=null) ? `${r.wintersLow.toFixed(0)}\u2013${r.wintersHigh.toFixed(0)} mmHg` : '—';
  dEl.textContent = (r.deltaGap!=null && r.deltaRatio!=null) ? `\u0394gap ${r.deltaGap.toFixed(1)}, ratio ${r.deltaRatio.toFixed(2)}` : '—';
  let lines=[];
  if(r.ag!=null && r.ag>12) lines.push(`Elevated anion gap (${r.ag.toFixed(1)}) — consider high-AG metabolic acidosis (lactate, ketones, uraemia, toxins).`);
  if(r._inputs.paco2!=null && r.wintersFlag==='high') lines.push(`<b>PaCO\u2082 (${r._inputs.paco2}) is above Winter's expected range (${r.wintersLow.toFixed(0)}\u2013${r.wintersHigh.toFixed(0)}) — inadequate respiratory compensation / concurrent respiratory acidosis. Reassess airway/ventilation.</b>`);
  else if(r._inputs.paco2!=null && r.wintersFlag==='low') lines.push(`PaCO\u2082 (${r._inputs.paco2}) is below Winter's expected range — concurrent respiratory alkalosis (e.g. independent hyperventilation, pain, sepsis-driven tachypnea).`);
  else if(r.wintersFlag==='appropriate') lines.push(`PaCO\u2082 is within the expected compensatory range for this HCO\u2083\u207b (Winter's formula).`);
  if(r.deltaRatio!=null){
    if(r.deltaRatio<0.4) lines.push('Delta ratio <0.4 — suggests a concurrent normal-AG (hyperchloremic) metabolic acidosis.');
    else if(r.deltaRatio>2) lines.push('Delta ratio >2 — suggests a concurrent metabolic alkalosis or pre-existing elevated HCO\u2083\u207b (e.g. chronic respiratory acidosis compensation).');
  }
  iEl.innerHTML = lines.join('<br>') || 'Enter Na, Cl and HCO\u2083\u207b to begin (add PaCO\u2082 for Winter\u2019s formula, albumin for corrected AG).';
}

    ? '<span class="badge high">\u22652: high risk</span> — consider full SOFA, sepsis work-up and escalation.'

/* Each domain function returns null — not 0 — when its input data
   isn't available, so "not measured" is never silently scored as
   "normal". calcSOFA() below tracks which domains were null and
   surfaces that explicitly instead of folding it into the total. */
function sofaResp(pf){
  if(pf==null) return null;
  if(pf>=400) return 0; if(pf>=300) return 1; if(pf>=200) return 2; if(pf>=100) return 3; return 4;
}
function sofaCoag(plt){
  if(!plt) return null;
  if(plt>=150) return 0; if(plt>=100) return 1; if(plt>=50) return 2; if(plt>=20) return 3; return 4;
}
function sofaLiver(bili){ // umol/L
  if(!bili) return null;
  if(bili<20) return 0; if(bili<33) return 1; if(bili<102) return 2; if(bili<204) return 3; return 4;
}
function sofaRenal(cr, uo){ // cr umol/L, uo mL/24h
  if(!cr && !uo) return null;
  let ptsCr=0;
  if(cr){ if(cr<110) ptsCr=0; else if(cr<171) ptsCr=1; else if(cr<300) ptsCr=2; else if(cr<440) ptsCr=3; else ptsCr=4; }
  let ptsUo=0;
  if(uo){ if(uo<200) ptsUo=4; else if(uo<500) ptsUo=3; }
  return Math.max(ptsCr, ptsUo);
}
function sofaCV(tier, map){
  // tier index 0-4 per chip order; -1 means no CV chip selected at all
  if(tier===4) return 4;
  if(tier===3) return 3;
  if(tier===2) return 2;
  if(tier===1) return 1;
  if(tier===0) return 0; // "None / MAP ≥70" explicitly selected — a real, documented 0
  if(map!=null) return map<70 ? 1 : 0; // no chip picked, but a MAP value exists
  return null; // neither a CV chip nor a MAP value — genuinely unknown
}
function sofaCNS(gcs){
  if(gcs==null) return null;
  if(gcs===15) return 0; if(gcs>=13) return 1; if(gcs>=10) return 2; if(gcs>=6) return 3; return 4;
}

function calcSOFA(){
  const target=document.getElementById('sofaVal'); if(!target) return;
  const pao2=+val('abg_pao2'), fio2=+val('abg_fio2');
  const pf = (pao2&&fio2)? pao2/fio2 : null;
  const plt=+val('l_plt'), bili=+val('l_bili'), cr=+val('l_cr'), uo=+val('s_uo');
  const gcsEl=document.getElementById('gcsTotal'); const gcs = gcsEl? +gcsEl.textContent : 15;
  const mapv = +((val('v_map')||'').replace(/[^0-9]/g,'')) || null;
  const cvChips = [...document.querySelectorAll('#grp_cv .chip')];
  let cvTier = -1;
  cvChips.forEach((c,i)=>{ if(c.classList.contains('on')) cvTier=i; });

  const domains = {
    Respiratory: sofaResp(pf), Coagulation: sofaCoag(plt), Liver: sofaLiver(bili),
    Cardiovascular: sofaCV(cvTier, mapv), CNS: sofaCNS(gcs), Renal: sofaRenal(cr, uo)
  };
  const missing = Object.entries(domains).filter(([,v])=>v===null).map(([k])=>k);
  const total = Object.values(domains).reduce((s,v)=>s+(v||0),0);
  target.textContent = total;
  const fmt = v => v===null ? 'N/A' : v;
  document.getElementById('sofaBreakdown').innerHTML =
    `Resp ${fmt(domains.Respiratory)} · Coag ${fmt(domains.Coagulation)} · Liver ${fmt(domains.Liver)} · CV ${fmt(domains.Cardiovascular)} · CNS ${fmt(domains.CNS)} · Renal ${fmt(domains.Renal)}`
    + (missing.length ? `<br><b style="color:var(--red,#b8412f)">\u26a0 SOFA incomplete — ${missing.join(', ')} not assessed. Total (${total}) reflects only the ${6-missing.length}/6 domains with data, not the full picture.</b>` : '');
  let mort;
  if(total<=6) mort='mortality generally <10%';
  else if(total<=9) mort='mortality roughly 15\u201320%';
  else if(total<=12) mort='mortality roughly 40\u201350%';
  else if(total<=14) mort='mortality roughly 50\u201360%';
  else mort='mortality >80%';
  document.getElementById('sofaMortality').textContent = missing.length
    ? `Mortality association withheld — score is incomplete (see above). Complete all 6 domains before treating this as a reportable SOFA.`
    : `Approximate association: ${mort} (trend the score serially — a rising SOFA in the first 48h matters more than the single value).`;
  updateStickyBar();
}

/* ---- APACHE II ---- */
/* As with SOFA above: each sub-function returns null (not 0) for
   missing input, so an unentered variable is never silently scored
   as "normal". calcAPACHE() tracks and surfaces what's missing. */
function apAge(age){
  if(!age) return null;
  if(age<44) return 0; if(age<54) return 2; if(age<64) return 3; if(age<74) return 5; return 6;
}
function apTemp(t){
  if(!t) return null;
  if(t>=41) return 4; if(t>=39) return 3; if(t>=38.5) return 1; if(t>=36) return 0; if(t>=34) return 1; if(t>=32) return 2; if(t>=30) return 3; return 4;
}
function apMAPpts(m){
  if(!m) return null;
  if(m>=160) return 4; if(m>=130) return 3; if(m>=110) return 2; if(m>=70) return 0; if(m>=50) return 2; return 4;
}
function apHR(h){
  if(!h) return null;
  if(h>=180) return 4; if(h>=140) return 3; if(h>=110) return 2; if(h>=70) return 0; if(h>=55) return 2; if(h>=40) return 3; return 4;
}
function apRR(r){
  if(!r) return null;
  if(r>=50) return 4; if(r>=35) return 3; if(r>=25) return 1; if(r>=12) return 0; if(r>=10) return 1; if(r>=6) return 2; return 4;
}
function apOxy(fio2, pao2){
  if(!fio2) return null;
  if(fio2>=0.5){
    if(!pao2) return null;
    // approximate A-aDO2 using assumed PAtm 760, PH2O 47, RQ .8: PAO2 = FiO2*(760-47) - PaCO2/0.8
    const paco2 = +val('abg_paco2')||40;
    const pAO2 = fio2*(760-47) - paco2/0.8;
    const aad = pAO2 - (pao2||0);
    if(aad>=500) return 4; if(aad>=350) return 3; if(aad>=200) return 2; return 0;
  } else {
    if(!pao2) return null;
    if(pao2<55) return 4; if(pao2<61) return 3; if(pao2<71) return 1; return 0;
  }
}
function apPH(ph){
  if(!ph) return null;
  if(ph>=7.7) return 4; if(ph>=7.6) return 3; if(ph>=7.5) return 1; if(ph>=7.33) return 0; if(ph>=7.25) return 2; if(ph>=7.15) return 3; return 4;
}
function apNa(na){
  if(!na) return null;
  if(na>=180) return 4; if(na>=160) return 3; if(na>=155) return 2; if(na>=150) return 1; if(na>=130) return 0; if(na>=120) return 2; if(na>=111) return 3; return 4;
}
function apK(k){
  if(!k) return null;
  if(k>=7) return 4; if(k>=6) return 3; if(k>=5.5) return 1; if(k>=3.5) return 0; if(k>=3) return 1; if(k>=2.5) return 2; return 4;
}
function apCr(cr_umol, aki){
  if(!cr_umol) return null;
  const cr = cr_umol/88.4; // to mg/dL
  let pts;
  if(cr>=3.5) pts=4; else if(cr>=2.0) pts=3; else if(cr>=1.5) pts=2; else if(cr>=0.6) pts=0; else pts=2;
  return aki? pts*2 : pts;
}
function apHct(h){
  if(!h) return null;
  if(h>=60) return 4; if(h>=50) return 2; if(h>=46) return 1; if(h>=30) return 0; if(h>=20) return 2; return 4;
}
function apWBC(w){
  if(!w) return null;
  if(w>=40) return 4; if(w>=20) return 2; if(w>=15) return 1; if(w>=3) return 0; if(w>=1) return 2; return 4;
}
function apGCSpts(gcs){ return gcs==null ? null : 15-gcs; }

function calcAPACHE(){
  const target=document.getElementById('apacheVal'); if(!target) return;
  const age=+val('ap_age')||null;
  const tempF=+val('v_temp'), temp=tempF?(tempF-32)*5/9:null, map=+((val('v_map')||'').replace(/[^0-9]/g,''))||null, hr=+val('v_hr')||null, rr=+val('v_rr')||null;
  const fio2=+val('abg_fio2')||null, pao2=+val('abg_pao2')||null, ph=+val('abg_ph')||null;
  const na=+val('l_na')||null, k=+val('l_k')||null, cr=+val('l_cr')||null;
  const hct=+val('ap_hct')||null, wbc=+val('ap_wbc')||null;
  const gcsEl=document.getElementById('gcsTotal'); const gcs=gcsEl?+gcsEl.textContent:null;

  const akiFlag = ([...document.querySelectorAll('[data-group="arf"].chip.on')].map(c=>c.textContent)[0]||'').startsWith('Yes');
  const parts = {
    Age: apAge(age), Temperature: apTemp(temp), MAP: apMAPpts(map), 'Heart rate': apHR(hr), 'Resp. rate': apRR(rr),
    Oxygenation: apOxy(fio2,pao2), pH: apPH(ph), Sodium: apNa(na), Potassium: apK(k), Creatinine: apCr(cr,akiFlag),
    Hematocrit: apHct(hct), WBC: apWBC(wbc), GCS: apGCSpts(gcs)
  };
  const missing = Object.entries(parts).filter(([,v])=>v===null).map(([k])=>k);
  const pts = Object.values(parts).reduce((s,v)=>s+(v||0),0);

  const chronicWrap = document.getElementById('grp_apchronic');
  let chronicPts=0;
  if(chronicWrap){
    const sel = chronicWrap.querySelector('.chip.on');
    if(sel){
      const txt = sel.textContent;
      if(txt.startsWith('Nonoperative')) chronicPts=5;
      else if(txt.startsWith('Elective')) chronicPts=2;
    }
  }
  const total = pts+chronicPts;
  target.textContent = total;
  const mortEl = document.getElementById('apacheMortality');
  if(missing.length){
    mortEl.innerHTML = `<b style="color:var(--red,#b8412f)">\u26a0 APACHE II incomplete — ${esc(missing.join(', '))} not entered.</b> Displayed total (${total}) only sums the ${13-missing.length}/13 acute-physiology variables with data — treat as provisional, not the true score, until every variable above is entered.`;
  } else {
    let mortText;
    if(total<=9) mortText='~4–8%'; else if(total<=14) mortText='~15–20%'; else if(total<=19) mortText='~25–35%';
    else if(total<=24) mortText='~40–55%'; else if(total<=29) mortText='~55–75%'; else mortText='>80%';
    mortEl.textContent = `Approximate predicted hospital mortality: ${mortText} (Knaus 1985 reference bands — treat as a rough guide, not a precise individual prediction).`;
  }
  updateStickyBar();
}

/* ---------------- RENAL FUNCTION / DOSING REFERENCE ---------------- */
// Self-contained fallbacks — used only if shared/clinical-calc.js failed to load
// (e.g. testing this file standalone, outside the full ED-Suite folder structure).
function fallbackCockcroftGault(age, wt, sex, cr_umol){
  const cr_mgdl = cr_umol/88.4;
  let crcl = ((140-age)*wt)/(72*cr_mgdl);
  if(String(sex).toUpperCase().charAt(0)==='F') crcl *= 0.85;
  return Math.round(crcl);
}
function fallbackCkdEpi2021(age, sex, cr_umol){
  const cr_mgdl = cr_umol/88.4;
  const isFemale = String(sex).toUpperCase().charAt(0)==='F';
  const k = isFemale?0.7:0.9, a = isFemale?-0.241:-0.302, sexFactor = isFemale?1.012:1.0;
  const minR = Math.min(cr_mgdl/k,1), maxR = Math.max(cr_mgdl/k,1);
  return Math.round(142 * Math.pow(minR,a) * Math.pow(maxR,-1.200) * Math.pow(0.9938,age) * sexFactor);
}
function fallbackRenalBand(v){
  if(v>=90) return 'Normal / high (\u226590)';
  if(v>=60) return 'Mildly decreased (60\u201389)';
  if(v>=45) return 'Mild-moderate decrease (45\u201359)';
  if(v>=30) return 'Moderate-severe decrease (30\u201344)';
  if(v>=15) return 'Severely decreased (15\u201329)';
  return 'Kidney failure (<15) / consider CRRT-HD range';
}
function calcRenalDosing(){
  const crclEl = document.getElementById('crclVal');
  if(!crclEl) return;
  const age=+val('p_age')||+val('ap_age'), wt=+val('v_wt'), sex=val('p_sex'), cr_umol=+val('l_cr');
  const tableBox = document.getElementById('renalDoseTable');
  const ckdepiEl = document.getElementById('ckdepiVal');
  const haveEpiInputs = age && sex && cr_umol;
  const haveCgInputs = age && wt && sex && cr_umol;
  if(!haveEpiInputs && !haveCgInputs){
    crclEl.textContent='—';
    document.getElementById('crclInterp').textContent = 'Enter age, sex, weight (Sec. F) and creatinine (Sec. H) to estimate.';
    if(ckdepiEl){ ckdepiEl.textContent='—'; document.getElementById('ckdepiInterp').textContent='Enter age, sex and creatinine (Sec. H) to estimate.'; }
    if(tableBox) tableBox.innerHTML='';
    renderAbxList();
    return;
  }
  let crcl=null, band='', epi=null, epiBand='';
  if(haveCgInputs){
    crcl = window.ClinicalCalc ? ClinicalCalc.cockcroftGault(age, wt, sex, cr_umol) : fallbackCockcroftGault(age, wt, sex, cr_umol);
    band = window.ClinicalCalc ? ClinicalCalc.renalBand(crcl) : fallbackRenalBand(crcl);
  }
  if(haveEpiInputs){
    epi = window.ClinicalCalc ? ClinicalCalc.ckdEpi2021(age, sex, cr_umol) : fallbackCkdEpi2021(age, sex, cr_umol);
    epiBand = window.ClinicalCalc ? ClinicalCalc.renalBand(epi) : fallbackRenalBand(epi);
  }
  if(crcl!=null){
    crclEl.textContent = crcl+' mL/min';
    document.getElementById('crclInterp').textContent = `Cockcroft-Gault — ${band}. Actual body weight used; consider adjusted body weight if obese.`;
  } else {
    crclEl.textContent = '—';
    document.getElementById('crclInterp').textContent = 'Enter weight (Sec. F) as well to estimate Cockcroft-Gault.';
  }
  if(ckdepiEl){
    if(epi!=null){
      ckdepiEl.textContent = epi+' mL/min/1.73m\u00b2';
      document.getElementById('ckdepiInterp').textContent = `CKD-EPI 2021 (race-free) — ${epiBand}. Not weight-based; may differ from Cockcroft-Gault at extremes of body size.`;
    } else {
      ckdepiEl.textContent = '—';
      document.getElementById('ckdepiInterp').textContent = 'Enter age, sex and creatinine (Sec. H) to estimate.';
    }
  }
  if(crcl==null){ if(tableBox) tableBox.innerHTML=''; renderAbxList(); return; }

  const doses = {
    'Piperacillin-tazobactam': crcl>=40?'4.5 g IV q6h':(crcl>=20?'3.375\u20134.5 g IV q8h':'2.25 g IV q6h (extended infusion preferred)'),

  }

}

/* ---------------- ICU criteria live flag ---------------- */
/* ================= CLINICAL SAFETY ENGINE =================
   Scans the current form state for dangerous omissions and
   contradictions and classifies them as:
     CRITICAL   — must resolve before this can be treated as a final plan
     WARNING    — clinician review required
     INCOMPLETE — information/score not yet complete
   This does NOT decide clinical management — it flags where the
   entered data suggests a decision is still outstanding. */
function chipOn(group, textStartsWith){
  const chips = [...document.querySelectorAll(`[data-group="${CSS.escape(group)}"].chip.on`)];
  if(textStartsWith==null) return chips.length>0;
  return chips.some(c=>c.textContent.startsWith(textStartsWith));
}
function anyChipOn(group){ return chipOn(group, null); }

function validateClinicalSafety(){
  const critical=[], warning=[], incomplete=[];

  // --- Baseline identity / admin (hard-stop list) ---
  if(!val('p_name')) critical.push('Patient name not entered.');
  if(!val('a_date') || !val('a_time')) critical.push('Admission date/time not entered.');
  if(!val('dx_primary')) critical.push('Primary diagnosis not entered.');
  if(!val('h_allergy')) critical.push('Allergy status not documented (enter "NKDA" if genuinely none known).');
  if(!anyChipOn('code')) critical.push('Code status / goals-of-care not selected (Section T1).');

  const hr=+val('v_hr')||null, sbp=+val('v_sbp')||null, rr=+val('v_rr')||null, spo2=+val('v_spo2')||null, tempF=+val('v_temp')||null;
  const vitalsEntered = [hr,sbp,rr,spo2,tempF].filter(v=>v!=null).length;
  if(vitalsEntered===0) critical.push('No vital signs recorded.');
  else if(vitalsEntered<5){
    const missingVitals=[]; if(hr==null)missingVitals.push('HR'); if(sbp==null)missingVitals.push('SBP'); if(rr==null)missingVitals.push('RR'); if(spo2==null)missingVitals.push('SpO\u2082'); if(tempF==null)missingVitals.push('Temp');
    incomplete.push(`Vitals incomplete — ${missingVitals.join(', ')} not entered.`);
  }

  // --- Shock physiology vs vasopressor plan ---
  const mapv = +((val('v_map')||'').replace(/[^0-9]/g,''))||null;
  const cvChips = [...document.querySelectorAll('#grp_cv .chip')];
  let cvTier=-1; cvChips.forEach((c,i)=>{ if(c.classList.contains('on')) cvTier=i; });
  const shockPresent = (mapv!=null && mapv<65) || cvTier>=2;
  const pressorAgent = getChipValue('pressor');
  const vasopressorPlanned = pressorAgent && pressorAgent!=='None';
  if(shockPresent && !vasopressorPlanned){
    critical.push(`Shock physiology (${mapv!=null&&mapv<65?'MAP '+mapv+' <65':'high vasopressor SOFA tier'}) without a documented vasopressor plan (Section P \u2013 Vasopressor/Inotrope).`);
  }

  // --- Severe hypoxemia vs respiratory support plan ---
  const pao2=+val('abg_pao2')||null, fio2=+val('abg_fio2')||null;
  const pf = (pao2 && fio2) ? pao2/fio2 : null;
  const oxySupport = getChipValue('oxy');
  const ESCALATED_RESP_SUPPORT = ['HFNC','NIV','Invasive MV'];
  const respPlanned = ESCALATED_RESP_SUPPORT.includes(oxySupport);
  if(pf!=null && pf<100 && !respPlanned){
    critical.push(`Severe hypoxemic respiratory failure (P/F ${pf.toFixed(0)}) without a documented respiratory-support plan (Section P \u2013 Oxygen/ventilation support).`);
  }

  // --- Invasive MV selected but ventilator prescription incomplete, or airway status mismatch ---
  const airwayStatus = getChipValue('airway');
  if(oxySupport==='Invasive MV'){
    const ventFields=['vent_mode','vent_tv','vent_rr','vent_peep','vent_fio2'];
    const missingVent = ventFields.filter(id=>!val(id));
    if(missingVent.length) critical.push(`Invasive mechanical ventilation selected but the ventilator prescription is incomplete (Section R \u2013 missing ${missingVent.length} of 5 fields).`);
    if(airwayStatus && airwayStatus!=='Intubated' && airwayStatus!=='Tracheostomy'){
      warning.push(`Invasive MV selected as the respiratory support, but Airway status is documented as "${airwayStatus}" \u2014 confirm airway status is up to date (Section P).`);
    }
  }

  // --- Acid-base: severe acidemia + Winter's + repeat-ABG plan ---
  const ph=+val('abg_ph')||null;
  const ab = getAcidBaseAnalysis();
  if(ph!=null && ph<7.20 && !val('abg_repeat_plan')){
    critical.push(`Severe acidemia (pH ${ph}) without a repeat-ABG / reassessment plan (Section I).`);
  }
  if(ab._inputs.paco2!=null && ab.wintersFlag==='high'){
    critical.push(`Inadequate respiratory compensation for the metabolic acidosis (Winter's expected PaCO\u2082 ${ab.wintersLow.toFixed(0)}\u2013${ab.wintersHigh.toFixed(0)}, actual ${ab._inputs.paco2}) — suggests a concurrent respiratory acidosis. Reassess airway/ventilation.`);
  }

  // --- AKI + severe acidemia ---
  const akiFlag = chipOn('arf','Yes');
  const cr = +val('l_cr')||null;
  if((akiFlag || (cr!=null && cr>300)) && ph!=null && ph<7.20){
    const renalPlanned = !!val('ord_rrt');
    warning.push(`AKI with severe acidemia — ${renalPlanned?'RRT indication already documented; ':'no RRT indication documented (Section R); '}confirm renal trajectory and electrolyte/ABG monitoring plan is explicit.`);
  }

  // --- Altered consciousness / airway protection ---
  const gcsEl=document.getElementById('gcsTotal'); const gcs=gcsEl?+gcsEl.textContent:null;
  if(gcs!=null && gcs<=8 && oxySupport!=='Invasive MV' && airwayStatus!=='Intubated'){
    warning.push(`GCS ${gcs} (\u22648) without invasive airway documented — assess airway-protective reflexes and consider intubation.`);
  }

  // --- VTE prophylaxis vs platelets/bleeding risk, and undocumented omission ---
  const vteMethod = getChipValue('vtemethod');
  const vtePlt = getChipValue('vte_plt');
  const vteBleed = getChipValue('vte_bleed');
  if((vteMethod==='LMWH'||vteMethod==='UFH') && (vtePlt==='<25k \u2014 mechanical only' || vteBleed==='High \u2014 mechanical ppx only' || vteBleed==='Active bleeding \u2014 no ppx')){
    critical.push(`Pharmacologic VTE prophylaxis (${vteMethod}) selected despite a documented contraindication (platelets/bleeding risk) — reconcile before finalizing (Section R1).`);
  } else if(vteMethod==='None \u2014 contraindicated' && !val('vte_reason')){
    warning.push('VTE prophylaxis withheld but no reason documented (Section R1).');
  } else if(!vteMethod){
    incomplete.push('VTE prophylaxis not yet assessed (Section R1).');
  }

  // --- Goals of care vs aggressive orders contradiction ---
  const goals = getChipValue('goals');
  if(goals==='Comfort-focused' && (vasopressorPlanned || oxySupport==='Invasive MV')){
    warning.push(`Goals of care documented as "Comfort-focused" but vasopressor/invasive-ventilation orders are active — confirm this reflects a deliberate, discussed decision (Section Y).`);
  }

  // --- Score completeness surfaced here too (mirrors the inline SOFA/APACHE banners) ---
  const sofaBreak = document.getElementById('sofaBreakdown');
  if(sofaBreak && sofaBreak.textContent.includes('N/A')) incomplete.push('SOFA score incomplete — see Section L for which domains are missing data.');
  const apMort = document.getElementById('apacheMortality');
  if(apMort && apMort.textContent.includes('incomplete')) incomplete.push('APACHE II score incomplete — see Section M for which variables are missing.');

  return {critical, warning, incomplete, ready: critical.length===0};
}

function openSafetyPanel(){
  renderSafetyModal(validateClinicalSafety(), null);
  document.getElementById('safetyOverlay').classList.add('show');
}
function closeSafetyPanel(){
  document.getElementById('safetyOverlay').classList.remove('show');
}
function renderSafetyModal(result, pendingExportKind){
  const modal = document.getElementById('safetyModal');
  const group = (label,cls,items) => items.length ? `<div class="sm-group"><div class="sm-label ${cls}">${esc(label)} (${items.length})</div><ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>` : '';
  let html = `<h3>Clinical Safety Check</h3><div class="sm-sub">Scans current entries for dangerous omissions/contradictions. This does not make clinical decisions — it flags where an entered finding suggests one is still outstanding.</div>`;
  html += group('Critical — must resolve','crit',result.critical);
  html += group('Warning — review required','warn',result.warning);
  html += group('Incomplete','inc',result.incomplete);
  if(!result.critical.length && !result.warning.length && !result.incomplete.length){
    html += `<div class="sm-ready">\u2713 No outstanding critical items, warnings or incomplete scores detected.</div>`;
  } else if(result.ready){
    html += `<div class="sm-ready">\u2713 No critical items — review the warnings/incomplete items above.</div>`;
  }
  html += `<div class="sm-actions">`;
  if(pendingExportKind){
    if(!result.ready){
      html += `<button onclick="closeSafetyPanel()">Review &amp; Fix</button><button class="sm-danger" onclick="proceedExport('${pendingExportKind}')">Export as Draft Anyway</button>`;
    } else {
      html += `<button class="sm-primary" onclick="proceedExport('${pendingExportKind}')">Continue to Export</button><button onclick="closeSafetyPanel()">Cancel</button>`;
    }
  } else {
    html += `<button class="sm-primary" onclick="closeSafetyPanel()">Close</button>`;
  }
  html += `</div>`;
  modal.innerHTML = html;
}
function requestExport(kind){
  const result = validateClinicalSafety();
  if(result.ready){ proceedExport(kind); return; }
  renderSafetyModal(result, kind);
  document.getElementById('safetyOverlay').classList.add('show');
}
function proceedExport(kind){
  closeSafetyPanel();
  if(kind==='print') doPrint();
  else if(kind==='word') exportWord();
  else if(kind==='copy') copySummary();
}

function collectFilled(){
  const by = {};
  const add = (section,label,value)=>{ if(!by[section]) by[section]=[]; by[section].push([label,value]); };
  FIELD_MAP.forEach(([id,label,section])=>{
    const v = val(id);
    if(v && v.trim()!=='') add(section,label,v);
  });
  CHIP_GROUPS.forEach(([grp,label,section])=>{
    const chosen = [...document.querySelectorAll(`[data-group="${CSS.escape(grp)}"].chip.on`)].map(c=>c.textContent);
    if(chosen.length) add(section,label,chosen.join(', '));
  });
  collectCustomLabs().forEach(([label,value])=>add('Labs__full',label,value));
  collectSelectedAbx().forEach(line=>add('Plan__full','Antibiotic',line));
  return by;
}

      `</div>`;
  }

  let blocks = '';
  const rowHTML = (l,v) => CONDENSED_MODE
    ? `<tr><td class="cl">${esc(l)}</td><td class="cv">${esc(v)}</td></tr>`
    : `<span><b>${esc(l)}:</b> ${esc(v)}</span>`;
  SECTION_ORDER.forEach(sec=>{
    const rows = by[sec];
    if(!rows || !rows.length) return;
    const isFull = sec.endsWith('__full');
    const title = SECTION_TITLES[sec] || sec;
    if(CONDENSED_MODE){
      blocks += `<div class="pblock${isFull?' full':''}"><h3>${esc(title)}</h3><table class="ctab">${rows.map(([l,v])=>rowHTML(l,v)).join('')}</table></div>`;
    } else if(isFull){
      blocks += `<div class="pblock full"><h3>${esc(title)}</h3>${rows.map(([l,v])=>`<p><b>${esc(l)}:</b> ${esc(v)}</p>`).join('')}</div>`;
    } else {
      blocks += `<div class="pblock"><h3>${esc(title)}</h3><div class="kv">${rows.map(([l,v])=>`<span><b>${esc(l)}:</b> ${esc(v)}</span>`).join('')}</div></div>`;
    }
  });

  let scoreBlock = '';
  if(Object.keys(scores).length){
    scoreBlock = CONDENSED_MODE
      ? `<div class="pblock"><h3>Severity Scores</h3><table class="ctab">${Object.entries(scores).map(([l,v])=>rowHTML(l,v)).join('')}</table></div>`
      : `<div class="pblock"><h3>Severity Scores</h3><div class="kv">${Object.entries(scores).map(([l,v])=>`<span><b>${esc(l)}:</b> ${esc(v)}</span>`).join('')}</div></div>`;
  }

  let bundleBlock = '';
  if(bundle.length){
    bundleBlock = `<div class="pblock full"><h3>Daily Care Bundle Orders (FAST HUGS BID)</h3>${bundle.map(b=>`<p><b>${b.letter} \u2013 ${esc(b.domain)} [${esc(b.status)}]:</b> ${esc(b.text)}${b.reason?` <i>(reason: ${esc(b.reason)})</i>`:''}</p>`).join('')}</div>`;
  }

  let medReconBlock = '';
  const medReconLines = collectMedRecon();
  if(medReconLines.length){
    medReconBlock = `<div class="pblock full"><h3>Medication Reconciliation</h3>${medReconLines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
  }

  let trajectBlock = '';
  const traj = collectTrajectory();
  if(traj.rows.length){
    trajectBlock = `<div class="pblock full"><h3>Longitudinal Trajectory \u2014 ${esc(traj.classification)}</h3>` +
      `<table style="width:100%;border-collapse:collapse;font-size:8.8pt;"><thead><tr><th style="text-align:left;border-bottom:1px solid #ccc;">Time</th><th style="border-bottom:1px solid #ccc;">MAP</th><th style="border-bottom:1px solid #ccc;">Pressor</th><th style="border-bottom:1px solid #ccc;">Lactate</th><th style="border-bottom:1px solid #ccc;">pH</th><th style="border-bottom:1px solid #ccc;">PaO\u2082</th><th style="border-bottom:1px solid #ccc;">Urine</th></tr></thead><tbody>` +
      traj.rows.map(r=>`<tr><td>${esc(r.time)}</td><td>${esc(r.map)}</td><td>${esc(r.pressor)}</td><td>${esc(r.lac)}</td><td>${esc(r.ph)}</td><td>${esc(r.pao2)}</td><td>${esc(r.uo)}</td></tr>`).join('') +
      `</tbody></table>${traj.comment?`<p>${esc(traj.comment)}</p>`:''}</div>`;
  }

  let reassessBlock = '';
  const reassessItems = generateReassessments();
  if(reassessItems.length){
    reassessBlock = `<div class="pblock full"><h3>Reassessment Schedule</h3>${reassessItems.map(it=>`<p>${it.critical?'\u26a0 ':''}<b>${esc(it.task)}</b> \u2014 ${esc(it.when)} (by ~${esc(it.time)}): ${esc(it.reason)}</p>`).join('')}</div>`;
  }

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>ICU Admission Note — ${esc(name)}</title>
  ${HW_STYLE?getHwFontLink():''}
  <style>
    @page{margin:${m.top}mm ${m.right}mm ${m.bottom}mm ${m.left}mm;}
    *{box-sizing:border-box;}
    body{font-family:Arial,Helvetica,sans-serif;font-size:9.6pt;line-height:1.32;color:#151515;margin:0;padding:0;${HW_STYLE?getHwFontCSS():''}}
    .hdr{border-bottom:2px solid #0f8a8a;padding-bottom:6px;margin:0 0 10px;}
    .hdr h1{font-size:15pt;margin:0 0 2px;color:#0b1b2b;}
    .hdr .meta{font-size:8.5pt;color:#555;}
    .status-banner{column-span:all;font-weight:800;font-size:9.5pt;letter-spacing:.4px;padding:6px 10px;border-radius:5px;margin:0 0 9px;}
    .status-banner.draft{background:#fdf1ea;color:#a85211;border:1px solid #e8b98b;}
    .status-banner.verified{background:#eaf7ef;color:#1f5c38;border:1px solid #9fd6b4;}
    .status-banner .sb-sub{font-weight:500;font-size:8.2pt;display:block;margin-top:2px;}
    .pblock.outstanding{border:1px solid #e8b98b;background:#fffaf5;padding:8px 10px;border-radius:6px;}
    .pblock.outstanding h3{color:#a85211;}
    .pblock.outstanding ul{margin:2px 0 6px 16px;padding:0;}
    .wrap{columns:2;column-gap:18px;}
    .pblock{break-inside:avoid-column;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid #e2e2e2;}
    .pblock.full{column-span:all;}
    h3{font-size:9.2pt;text-transform:uppercase;letter-spacing:.4px;color:#0b6868;margin:0 0 4px;}
    .kv{display:flex;flex-wrap:wrap;gap:4px 10px;}
    .kv span{white-space:normal;}
    .kv b{color:#333;}
    p{margin:2px 0 4px;}
    @media print{ body{padding:0;} }
    body.condensed{font-size:7.6pt;line-height:1.18;}
    body.condensed .hdr{padding-bottom:3px;margin:0 0 5px;}
    body.condensed .hdr h1{font-size:12pt;}
    body.condensed h3{font-size:7.4pt;margin:0 0 1px;}
    body.condensed .pblock{margin-bottom:3px;padding-bottom:2px;}
    body.condensed .ctab{width:100%;border-collapse:collapse;}
    body.condensed .ctab td{padding:0 4px 0 0;vertical-align:top;white-space:normal;}
    body.condensed .ctab td.cl{font-weight:700;color:#333;white-space:nowrap;padding-right:4px;}
    body.condensed .status-banner{padding:3px 6px;margin:0 0 4px;font-size:8pt;}
  </style></head>
  <body class="${CONDENSED_MODE?'condensed':''}">
    <div class="hdr">
      <h1>ICU Admission Note — ${esc(name)}${mrn?(' &middot; MRN '+esc(mrn)):''}</h1>
      <div class="meta">Generated ${esc(now)} &middot; ICU Admission Suite${CONDENSED_MODE?' &middot; Condensed format':''}</div>
    </div>
    <div class="wrap">${statusBanner}${outstandingBlock}${blocks}${scoreBlock}${medReconBlock}${bundleBlock}${trajectBlock}${reassessBlock}</div>
  </body></html>`;
}

/* ---------------- PRINT MARGIN SETTINGS ---------------- */
const PRINT_MARGINS = {top:65, right:12, bottom:12, left:12};
let HW_STYLE = false;
let HW_FONT_CHOICE = 'kalam';
let CONDENSED_MODE = false;
function getHwFontLink(){
  const fonts = window.ClinicalCalc ? ClinicalCalc.HW_FONTS : {kalam:{googleParam:'Kalam:wght@400;700'},caveat:{googleParam:'Caveat:wght@500;700'}};
  const cfg = fonts[HW_FONT_CHOICE] || fonts.kalam;
  return '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family='+cfg.googleParam+'&display=swap">';
}
function getHwFontCSS(){
  const base = window.ClinicalCalc ? ClinicalCalc.handwrittenFontCSS(HW_FONT_CHOICE) : "font-family:'Kalam',cursive !important;";
  return base + "font-size:17pt;line-height:1.5;";
}

function toggleMarginPanel(){
  const p = document.getElementById('marginPanel');
  if(!p) return;
  p.style.display = (p.style.display==='none'||!p.style.display) ? 'flex' : 'none';
}
function updateMargin(side, v){
  const n = parseFloat(v);
  if(!isNaN(n) && n>=0 && n<=80) PRINT_MARGINS[side] = n;
}

/* ---------------- OUTPUT: PRINT / PDF ---------------- */
function doPrint(){
  const html = generateNoteHTML();
  // Use hidden iframe approach — avoids popup blockers and CSS loading issues
  let iframe = document.getElementById('printIframe');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.id = 'printIframe';
    iframe.style.cssText = 'position:fixed;width:0;height:0;border:none;left:-9999px;';
    document.body.appendChild(iframe);
  }
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  let printed = false;
  const triggerPrint = ()=>{
    if(printed) return;
    printed = true;
    try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){ showToast('Print failed — try Word export instead'); }
  };
  if(HW_STYLE && doc.fonts && doc.fonts.ready){
    doc.fonts.ready.then(triggerPrint).catch(triggerPrint);
    setTimeout(triggerPrint, 1500);
  } else {
    // Give the iframe a moment to render
    setTimeout(triggerPrint, 500);
  }
}

/* ---------------- OUTPUT: WORD (.docx) ---------------- */
function exportWord(){
  if(typeof DocxLite === 'undefined'){ showToast('Word export is still loading — try again in a moment'); return; }
  const html = generateNoteHTML();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const container = doc.body;
  const name = (val('p_name')||'patient').replace(/\s+/g,'_');
  showToast('Generating Word document…');
  DocxLite.exportRealDocx(container, PRINT_MARGINS.top, PRINT_MARGINS.left, `ICU_Admission_${name}`, function(ok, err){
    if(ok) showToast('Word document downloaded');
    else showToast('Word export failed — check internet connection');
  });
}

/* ---------------- OUTPUT: COPY (plain text) ---------------- */
function buildTextSummary(){
  const by = collectFilled();
  const scores = collectScores();
  const bundle = collectBundle();
  const safety = validateClinicalSafety();
  const verifiedEl = document.getElementById('sg_verified');
  const isVerified = !!(verifiedEl && verifiedEl.checked) && safety.ready;

  let out = `ICU ADMISSION NOTE — ${val('p_name')||'Unnamed'}  (MRN ${val('p_mrn')||'—'})\n${'='.repeat(50)}\n`;
  if(isVerified){
    out += `\nICU ADMISSION ORDERS — VERIFIED BY ADMITTING PHYSICIAN\n${val('sg_reviewer')||'(reviewer not named)'} \u00b7 ${val('sg_verifytime')||new Date().toLocaleString()}\n`;
  } else {
    out += `\nDRAFT — NOT YET VERIFIED${!safety.ready?' ('+safety.critical.length+' safety item(s) require review)':''}\n`;
  }
  if(safety.critical.length || safety.warning.length || safety.incomplete.length){
    out += `\nOUTSTANDING PROBLEMS / SAFETY REVIEW\n`;
    safety.critical.forEach(i=>{ out += `[CRITICAL] ${i}\n`; });
    safety.warning.forEach(i=>{ out += `[WARNING]  ${i}\n`; });
    safety.incomplete.forEach(i=>{ out += `[INCOMPLETE] ${i}\n`; });
  }
  SECTION_ORDER.forEach(sec=>{
    const rows = by[sec];
    if(!rows || !rows.length) return;
    out += `\n${(SECTION_TITLES[sec]||sec).toUpperCase()}\n`;
    rows.forEach(([l,v])=>{ out += `${l}: ${v}\n`; });
  });
  if(Object.keys(scores).length){
    out += `\nSEVERITY SCORES\n`;
    Object.entries(scores).forEach(([l,v])=>{ out += `${l}: ${v}\n`; });
  }
  const medReconLines = collectMedRecon();
  if(medReconLines.length){
    out += `\nMEDICATION RECONCILIATION\n`;
    medReconLines.forEach(l=>{ out += `${l}\n`; });
  }
  if(bundle.length){
    out += `\nDAILY CARE BUNDLE ORDERS\n`;
    bundle.forEach(b=>{ out += `[${b.status}] ${b.letter} - ${b.domain}: ${b.text}${b.reason?' (reason: '+b.reason+')':''}\n`; });
  }
  const traj = collectTrajectory();
  if(traj.rows.length){
    out += `\nLONGITUDINAL TRAJECTORY — ${traj.classification}\n`;
    traj.rows.forEach(r=>{ out += `${r.time}: MAP ${r.map||'-'}, pressor ${r.pressor||'-'}, lactate ${r.lac||'-'}, pH ${r.ph||'-'}, PaO2 ${r.pao2||'-'}, urine ${r.uo||'-'}\n`; });
    if(traj.comment) out += `${traj.comment}\n`;
  }
  const reassessItems = generateReassessments();
  if(reassessItems.length){
    out += `\nREASSESSMENT SCHEDULE\n`;
    reassessItems.forEach(it=>{ out += `${it.critical?'[CRITICAL] ':''}${it.task} - ${it.when} (by ~${it.time}): ${it.reason}\n`; });
  }
  out += `\n${'='.repeat(50)}`;
  return out;
}

function copySummary(){
  const text = buildTextSummary();
  navigator.clipboard.writeText(text).then(()=>showToast('Note copied to clipboard')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); showToast('Note copied to clipboard');
  });
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function resetAll(){
  if(!confirm('Clear all entered data on this form?')) return;
  customLabs = []; selectedAbx = new Set(); medReconCustom = [];
  document.querySelectorAll('input,textarea').forEach(i=>{ if(i.type!=='checkbox') i.value=''; else i.checked=false; });
  document.querySelectorAll('select').forEach(s=>s.selectedIndex=0);
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on','crit'));
  ['gcsTotal'].forEach(id=>{const e=document.getElementById(id); if(e)e.textContent='15';});
  ['sofaVal','apacheVal','qsofaVal','pfRatio','crclVal'].forEach(id=>{const e=document.getElementById(id); if(e)e.textContent='\u2014';});
  buildSections(); // re-render bundle defaults etc.
  renderMedRecon();
  trajectInputHandlers();
  calcTrajectory();
  renderReassessments();
  updateProgress();
  updateStickyBar();
  if (icuAutoSave) icuAutoSave.clear();
  showToast('Form cleared');
}

/* ---------------- AUTO-SAVE / SESSION RECOVERY ----------------
   Fixes: refresh, tab switch, or phone lock previously wiped every
   field on this form (no persistence layer existed). Debounced
   auto-save to localStorage + restore-on-load, so an interrupted
   admission workflow can be resumed. */
const icuAutoSave = (typeof AutoSave !== 'undefined') ? AutoSave.attach('icu_admission_autosave_v2', {
  extra: () => ({ customLabs, selectedAbx: [...selectedAbx], medReconCustom }),
  beforeRestore: (data) => {
    if (data.extra) {
      if (Array.isArray(data.extra.customLabs)) { customLabs = data.extra.customLabs; renderCustomLabs(); }
      if (Array.isArray(data.extra.selectedAbx)) { selectedAbx = new Set(data.extra.selectedAbx); renderAbxList(); }
      if (Array.isArray(data.extra.medReconCustom)) { medReconCustom = data.extra.medReconCustom; }
    }
    renderMedRecon();
  },
  afterRestore: () => {
    calcMAP(); calcBMI(); calcGCS(); calcPF(); calcQSOFA(); calcSOFA(); calcAPACHE(); calcRenalDosing(); calcAcidBase();
    renderICUCriteriaFlag(); renderVentSuggestion();
    trajectInputHandlers(); calcTrajectory(); renderReassessments();
    updateProgress(); updateStickyBar();
    showToast('Restored your last unsaved session');
  }
}) : null;

/* ---------------- INIT ---------------- */
document.addEventListener('input', updateProgress);
buildTabs();
buildSections();
renderMedRecon();
trajectInputHandlers();
calcTrajectory();
renderReassessments();
(function setNow(){
  const now = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const dEl=document.getElementById('a_date'); if(dEl) dEl.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const tEl=document.getElementById('a_time'); if(tEl) tEl.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
})();
calcQSOFA();
calcRenalDosing();
updateProgress();
updateStickyBar();
if (icuAutoSave) icuAutoSave.restore();
if('serviceWorker' in navigator){navigator.serviceWorker.register('../../sw.js').catch(()=>{})}
</script>
